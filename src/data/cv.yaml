  - id: projects
    title: Projects
    entries:
      - id: homelab
        title: homelab (Kubernetes cluster)
        links:
          - label: blog
            url: https://velog.io/@isac322/homelab-구축-1
          - label: repository
            url: https://github.com/isac322/homelab
        summary: Linux 머신에 Kubernetes 설치 이후부터 GitOps 기반 클러스터 구축하고 운영하는 프로젝트
        body: |
          - 프로덕션급의 스택을 가진 Kubernetes cluster를 바닥부터 구축 & 운영하는 경험을 위해 작업
            - 인프라를 구성하고 자동 운영 상태를 만드는 것이 주목적
          - 현재도 해당 repository 기반 GitOps로 클러스터 운영중
          - 아래의 서버가 실제로 동작 중 (FYI. 웹 UI가 있는 서버들은 아닙니다)
            - [blocky](https://github.com/0xERR0R/blocky)라는 DNS proxy ⇨ dnsb.bhyoo.com (DNS, DNS over TLS, DNS over HTTPS)
            - [Python Formatter black의 서버](https://black.readthedocs.io/en/stable/usage_and_configuration/black_as_a_server.html) ⇨ [black.bhyoo.com](https://black.bhyoo.com)
          - 관련 기술: Kubernetes, Terraform, Helm, GitOps, ArgoCD, Traefik, Rook, Prometheus, Grafana, Docker, Cloudflare, Github Actions

      - title: arrow 라이브러리 전체 typing
        links:
          - label: PR
            url: https://github.com/arrow-py/arrow/pull/883
          - label: arrow
            url: https://github.com/arrow-py/arrow
        summary: 8k+ star의 시간 관련 Python 라이브러리에 기여
        body: |
          - 전체 코드에 Type annotation 추가하는 기여
          - diff 총 합 1200+ 줄 정도의 PR
          - 1.0.0 릴리즈에 포함됨

      - title: flake8-force-keyword-arguments
        links:
          - label: repository
            url: https://github.com/isac322/flake8-force-keyword-arguments
        summary: Python linter인 flake8의 플러그인 개발
        body: |
          - [기존 플러그인](https://github.com/vchaptsev/flake8-keyword-arguments)이 false alarm 문제가 있어서 개발
          - 정적 분석으로 파라미터가 여러개일 때 가독성을 위해 positional argument 대신 keyword argument를 사용하도록 가이드

