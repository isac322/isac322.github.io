profile:
  name: 유병훈
  headline: 코딩으로 스트레스 해소하는 서버 개발자
  email: bhyoo@bhyoo.com
  links:
    - label: GitHub
      url: https://github.com/isac322
    - label: LinkedIn
      url: https://www.linkedin.com/in/bh-yoo
    - label: 블로그
      url: https://velog.io/@isac322
  about: |
    DDD를 통한 도메인 정의와 빠른 문제 해결에 관심이 있는 서버 개발자입니다.  
    팀 간 __도메인 분리&정제__ 가 빠른 문제 해결과 적은 기술 부채의 핵심이라고 생각합니다.
    비즈니스 목표와 기술 부채 해결의 타협점을 찾기 위해서 빠르게 움직일 수 없도록 만드는 시스템을 찾고 개선하는 것을 즐깁니다.  
    좋은 개발자란 빠르고 기술적으로 올바르게 문제를 해결하는 사람이라 생각하기 때문에
    <mark>팀의 목표</mark>에 따라서 기술 부채를 의도하기도, 변경에 유연한 시스템을 디자인하기도 합니다.  
    현재 커리어 관심사는 팀 토폴로지의 Enabling team 역할입니다.  
    업무 이외에도 Linux와 오픈 소스에 관심이 있어서 [AUR에 패키지 관리](https://aur.archlinux.org/account/bhyoo)를 하거나, 만든 프로젝트를 github에 공유하기도 합니다.

