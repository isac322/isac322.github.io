          - [[Buzzvil](#buzzvil)] Kafka를 활용한 광고 서버와 할당 서버의 의존성 제거

      - title: 기술 부채 해결 / 레거시 개편
        body: |
          - [[Buzzvil](#buzzvil)] 모노리스 광고 서버 Python2 → Python3 포팅
          - [[Buzzvil](#buzzvil)] 광고 할당에 사용되는 레거시 Elasticsearch 광고 캐시 이주
          - [[Buzzvil](#buzzvil)] Anti-corruption Layer를 활용한 단계적 마이크로 서비스 분리

      - title: 인프라
        body: |
          - [[Buzzvil](#buzzvil)] Istio 트래픽 미러링으로 마이그레이션 검증
            - 7k+ RPS 광고 서버 포팅
            - 3k+ RPS 광고 할당 서버 분리
          - [[Buzzvil](#buzzvil)] DevOps Edge program 멤버로 지속적인 인프라 역량 학습
          - [[Buzzvil](#buzzvil)] 모노리스 프로젝트의 CI 소요시간 4배 단축
          - 개인 프로젝트로 HA로 구성된 Kubernetes 클러스터 2개를 바닥부터 구축 및 운영 중
            - 아래 [Projects의 homelab](#homelab) 참조

      - title: 팀을 넘어선 기술 공유 및 도입
        body: |
          - [[Buzzvil](#buzzvil)] [테크 블로그](https://tech.buzzvil.com/author/isac-yoo/)를 활용한 사내외 지식 공유
          - [[Buzzvil](#buzzvil)] 유관 프로덕트팀과의 도메인 분리를 선제적으로 제안 및 DDD 이주 가이드 & 리뷰
          - [[Buzzvil](#buzzvil)] Python expert group 리딩하며 Python 프로젝트 코드 퀄리티 개선
          - [[Buzzvil](#buzzvil)] Python type checker (mypy) & code formatter (black) 전사 도입
            - 제안서를 통한 전사 합의
            - 지속적인 typing 가이드 & 리뷰
            - Python 버전 업그레이드마다 신규 typing 기술 공유
          - [[Buzzvil](#buzzvil)] 프로젝트간 lint 설정을 버전으로 관리하며 동일하게 유지하는 툴 도입
          - [[Buzzvil](#buzzvil)] Python package manager로 pip-tools 대신 poetry 도입

      - title: 대용량 데이터 처리 및 성능 개선
        body: |
          - [[Buzzvil](#buzzvil)] 3k+ RPS 광고 할당에 사용되는 Elasticsearch의 Lucene 레벨 최적화로 latency 30% 감소
          - [[Buzzvil](#buzzvil)] 통계 서버와 소진제어 서비스에 asyncio 도입으로 throughput & latency 최적화
          - [[AB180](#ab180)] 트래킹 서버의 throughput 2배 향상

