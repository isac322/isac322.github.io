        role: Software Engineer
        period: "2019.09 ~ 2022.10"
        summary: MAU 2,000만+, 초당 광고 할당 3,000+의 리워드 광고 회사
        body: |
          - Golang으로 DSP (광고 할당 서버) 구축 및 Ad Exchange 연동
